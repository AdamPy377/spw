services:
  position-board:
    build: .
    container_name: position-board
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - /mnt/das/apps/position-board:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  position-board-backup:
    build: .
    container_name: position-board-backup
    restart: unless-stopped
    command: ["python", "backup.py"]
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - /mnt/das/apps/position-board:/data:ro
      - /mnt/das/apps/position-board/backups:/backups
    depends_on:
      position-board:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: position-board-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/lib/tailscale/certs:/certs:ro
    depends_on:
      position-board:
        condition: service_healthy
